cing:1px}.stats b{margin-top:5px}section svg{background:radial-gradient(ellipse at 50% 65%,#3a414c,#141820 70%);border-radius:12px;margin-top:10px} .caseOverlay{position:fixed;inset:0;background:#080a10ed;z-index:99;display:grid;place-items:center;padding:24px}.casePanel{width:min(100%,400px);text-align:center;padding:28px;background:#1b202a;border:1px solid #e8bd65;border-radius:24px}.crate{margin:30px auto;width:140px;height:100px;display:grid;place-items:center;font-size:48px;color:#e8bd65;border:3px solid #e8bd65;border-radius:15px;background:linear-gradient(135deg,#41454e,#141820);animation:crate .6s alternate infinite;box-shadow:0 0 35px #e8bd6533}.roll{letter-spacing:8px;color:#e8bd65;animation:reveal .4s alternate infinite;margin:20px 0}@keyframes crate{to{transform:scale(1.07) rotate(2deg);box-shadow:0 0 55px #e8bd6577}}.road{position:relative;height:160px;overflow:hidden;border-radius:12px;background:linear-gradient(#222b38 0 15%,#343941 15% 100%);margin:12px 0}.road:after{content:"";position:absolute;top:50%;width:100%;border-top:2px dashed #aaa;pointer-events:none}.runner{position:absolute;left:0;width:35%;bottom:0;z-index:1}.runner.rival{bottom:76px;filter:hue-rotate(120deg) brightness(.8)}.runner svg{background:none;margin:0}.runner svg defs{display:block}#gas{touch-action:none;user-select:none}#tach{height:18px}</style><main><header><h1>AUTO EMPIRE</h1><div id="balance"></div></header><small>RACING UPDATE / 0.4 · Локальный прототип</small><div id="view"></div></main><nav id="nav"></nav><script>
const catalog=[{name:'Lada Priora',hp:98,mass:1088,price:350000,rarity:'Обычная'},{name:'Lada Priora Gold',hp:98,mass:1088,price:25000000,rarity:'Легендарная'},{name:'ВАЗ-2107',hp:75,mass:1060,price:120000,rarity:'Обычная'},{name:'Lada 2108',hp:72,mass:945,price:180000,rarity:'Необычная'},{name:'Lada Niva',hp:83,mass:1285,price:480000,rarity:'Необычная'}];const initial=()=>({money:100000,keys:5,cars:[{id:1,model:0,stage:0,plate:null}],plates:[],parts:0,wins:0,selected:1,next:2});let s;try{s=JSON.parse(localStorage.getItem('ae01'))||initial()}catch{s=initial()}s.contractDay??='';s.inventory??=[];s.cars.forEach(c=>c.equip??={});s.partNext??=1;while(s.parts>0){s.inventory.push({id:s.partNext++,kind:0});s.parts--;}const parts=[{name:'Спортивный фильтр',slot:'Впуск',gain:4,rarity:'Обычная',color:'#aab0bb',chance:50},{name:'Холодный впуск',slot:'Впуск',gain:9,rarity:'Необычная',color:'#44ce91',chance:30},{name:'Спортивный выпуск',slot:'Выпуск',gain:12,rarity:'Редкая',color:'#579cff',chance:15},{name:'Турбина Stage 2',slot:'Наддув',gain:45,rarity:'Эпическая',color:'#b17aff',chance:4},{name:'Кованый мотор',slot:'Двигатель',gain:65,rarity:'Легендарная',color:'#e8bd65',chance:0.9},{name:'Phantom Turbo',slot:'Наддув',gain:90,rarity:'Мифическая',color:'#ff5577',chance:0.1}];function compatible(p,c){return p.slot!=='Наддув'||c.model!==4}function partRoll(){let r=Math.random()*100;return parts.findIndex(p=>(r-=p.chance)<0)}let tab=0,msg='',race=null;const names=['Главная','Гараж','Номера','Кейсы','Тюнинг','Гонки'];const fmt=n=>n.toLocaleString('ru-RU')+' ₽';const save=()=>localStorage.setItem('ae01',JSON.stringify(s));const car=()=>s.cars.find(c=>c.id===s.selected)||s.cars[0];const model=()=>catalog[car().model];const hp=()=>Math.round(model().hp*(1+car().stage*.16)+Object.values(car().equip||{}).reduce((n,k)=>n+parts[k].gain,0));function action(f){msg='';f();save();render()}function plate(){const a='АВЕКМНОРСТУХ',l=()=>a[Math.random()*a.length|0];let p;do{p=l()+' '+String(1+(Math.random()*999|0)).padStart(3,'0')+' '+l()+l()+' '+[77,95,777,199][Math.random()*4|0]}while(s.plates.includes(p));return p}function draw(){const m=car().model, gold=m===1, box=m===2||m===4, hatch=m===3||m===4, roof=box?22:29, color=gold?'#cba044':m===2?'#829b80':m===3?'#a75b50':m===4?'#b0a48b':'#899aaa';const wheel=x=>`<g transform="translate(${x} 111)"><circle r="25" fill="#101216" stroke="#353940" stroke-width="2"/><circle r="17" fill="#555c64" stroke="#b7bec4"/><circle r="13" fill="#22262c"/>${Array.from({length:10},(_,i)=>`<path d="M-2 -4L-3 -15H3L2 -4Z" fill="#b9c0c6" transform="rotate(${i*36})"/>`).join('')}<circle r="5" fill="#777f87"/></g>`;return `<svg viewBox="0 0 360 160" role="img" aria-label="Авторский векторный концепт ${model().name}"><defs><linearGradient id="paint" x2="0" y2="1"><stop stop-color="#f0e7d0"/><stop offset=".22" stop-color="${color}"/><stop offset=".56" stop-color="${color}"/><stop offset="1" stop-color="#34363a"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#71808e"/><stop offset="1" stop-color="#141c26"/></linearGradient></defs><ellipse cx="180" cy="139" rx="165" ry="10" fill="#000" opacity=".6"/><path d="M15 104L20 78Q28 70 74 64L${box?102:119} ${roof}Q125 ${roof-5} 195 ${roof}L${hatch?252:239} 63L${hatch?294:322} 72Q340 79 344 101L338 121H15Z" fill="url(#paint)" stroke="#c0b8aa"/><path d="M85 64L${box?107:124} ${roof+5}H165V64ZM172 ${roof+5}H195L${hatch?242:229} 64H172Z" fill="url(#glass)" stroke="#262c34" stroke-width="3"/><path d="M26 81Q160 73 333 81M20 104H340" fill="none" stroke="#e8e4d9" opacity=".35"/><path d="M168 67V117M240 68L245 115M84 68L92 114" fill="none" stroke="#30353b" opacity=".8"/><path d="M151 79h12m65 0h12" stroke="#ddd" stroke-width="3" stroke-linecap="round"/><path d="M20 81L39 77V89H20Z" fill="#a52c32"/><path d="M315 77L338 83V91H313Z" fill="#e6e8d8"/><path d="M15 119H344" stroke="#25282c" stroke-width="5"/>${wheel(78)}${wheel(282)}</svg>`}function openCase(type){if(!s.keys)return;s.keys--;if(type===0){let r=Math.random(),m=r<.009?1:r<.409?0:r<.809?2:r<.929?3:4;s.cars.push({id:s.next++,model:m,stage:0,plate:null});msg='Получено: '+catalog[m].name}else if(type===1){let p=plate();s.plates.push(p);msg='Получен номер: '+p}else{let k=partRoll();if(k<0)k=5;s.inventory.push({id:s.partNext++,kind:k});msg='Получено: '+parts[k].name+' · '+parts[k].rarity}}function render(){document.querySelector('#balance').innerHTML='<b class="gold">'+fmt(s.money)+'</b><br><small>Ключи: '+s.keys+'</small>';document.querySelector('#nav').innerHTML=names.map((n,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};msg='';render()">${n}</button>`).join('');let v='<h2>'+names[tab]+'</h2>';if(msg)v+='<section class="reveal gold">'+msg+'</section>';if(tab===0)v+=`<section><small>ТВОЯ КОЛЛЕКЦИЯ</small><h2>${s.cars.length} авто · ${s.plates.length} номеров</h2>Победы: ${s.wins}<button onclick="tab=5;render()">На тренировочную гонку</button></section><section>Ежедневный контракт<button ${s.contractDay===new Date().toDateString()?'disabled':''} onclick="action(()=>{if(s.contractDay===new Date().toDateString())return;s.contractDay=new Date().toDateString();s.keys++;s.money+=2000;msg='Контракт выполнен: +1 ключ, +2 000 ₽'})">Выполнить контракт</button><small>Один раз в день по локальному времени.</small></section>`;if(tab===1)v+=`<section><select onchange="action(()=>s.selected=+this.value)">${s.cars.map(c=>`<option value="${c.id}" ${c.id===car().id?'selected':''}>${catalog[c.model].name} #${c.id}</option>`).join('')}</select>${draw()}<small>Авторский векторный концепт · не финальная модель</small><h2>${model().name}</h2><p class="gold">${model().rarity}</p><div class="stats"><div><small>МОЩНОСТЬ</small><b>${hp()} л.с.</b></div><div><small>МАССА</small><b>${model().mass} кг</b></div><div><small>ТЮНИНГ</small><b>Stage ${car().stage}</b></div></div><p>${fmt(model().price)}</p>${car().plate?'<div class="plate">'+car().plate+'</div>':''}</section>`;if(tab===2)v+=`<section><button ${s.money<1000?'disabled':''} onclick="action(()=>{s.money-=1000;let p=plate();s.plates.push(p);msg=p})">Получить номер · 1 000 ₽</button></section>`+s.plates.map((p,i)=>`<section><div class="plate">${p}</div><button onclick="action(()=>{s.cars.forEach(c=>{if(c.plate===s.plates[${i}])c.plate=null});car().plate=s.plates[${i}];msg='Номер установлен'})">Установить на ${model().name}</button></section>`).join('');if(tab===3)v+=['Автомобильный','Госномера','Тюнинг'].map((n,i)=>`<section><small>EMPIRE CASE / 0${i+1}</small><h2>${n}</h2><p>${i===0?'Gold 0,9% · Priora 40% · ВАЗ 40% · 2108 12% · Niva 7,1%':i===1?'Случайная комбинация РФ':parts.map(p=>p.rarity+' '+p.chance+'%').join(' · ')}</p><button ${!s.keys?'disabled':''} onclick="animateCase(${i})">Открыть · 1 игровой ключ</button></section>`).join('');if(tab===4)v+=`<section><small>PERFORMANCE WORKSHOP</small><h2>${model().name}</h2>${draw()}<div class="stats"><div><small>МОЩНОСТЬ</small><b>${hp()} л.с.</b></div><div><small>ДЕТАЛИ</small><b>${Object.keys(car().equip).length}/4</b></div><div><small>ИНВЕНТАРЬ</small><b>${s.inventory.length}</b></div></div></section>`+['Впуск','Выпуск','Наддув','Двигатель'].map(slot=>`<section><small>${slot.toUpperCase()}</small><p>${car().equip[slot]===undefined?'Стандартная деталь':parts[car().equip[slot]].name}</p>${car().equip[slot]===undefined?'':`<button onclick="removePart('${slot}')">Снять деталь</button>`}</section>`).join('')+`<h2>Склад деталей</h2>`+(s.inventory.length?s.inventory.map(item=>{let p=parts[item.kind];return `<section style="border-left:3px solid ${p.color}"><small style="color:${p.color}">${p.rarity}</small><h3>${p.name}</h3><p>${p.slot} · +${p.gain} л.с.</p><button ${!compatible(p,car())||s.money<5000?'disabled':''} onclick="installPart(${item.id})">${compatible(p,car())?'Установить · 5 000 ₽':'Несовместимо'}</button></section>`}).join(''):'<section>Склад пуст. Получи детали из кейсов.</section>');if(tab===5)v+=`<section><small>DRAG / 402 М</small><h2>${model().name}</h2><div class="road"><div id="rival" class="runner rival">${draw().replaceAll('paint','rivalpaint').replaceAll('glass','rivalglass')}</div><div id="player" class="runner">${draw()}</div></div><div class="stats"><div><small>СКОРОСТЬ</small><b id="speed">0 км/ч</b></div><div><small>ПЕРЕДАЧА</small><b id="gear">1</b></div><div><small>ВРЕМЯ</small><b id="clock">0.00</b></div></div><p>Обороты <b id="rpm">900</b></p><progress id="tach" max="7000" value="900"></progress><p id="raceout">Нажми старт, затем переключай передачи около 6000 об/мин.</p><button id="startRace" onclick="runRace()">Начать заезд</button><div class="row"><button id="gas" disabled>ГАЗ</button><button id="shift" disabled onclick="shiftRace()">ПЕРЕДАЧА +</button></div><small>Удерживай газ. Тренировочный соперник: 18,5 с. Локальная симуляция.</small></section>`;document.querySelector('#view').innerHTML=v}function installPart(id){action(()=>{let i=s.inventory.findIndex(x=>x.id===id);if(i<0||s.money<5000)return;let item=s.inventory[i],p=parts[item.kind],c=car();if(!compatible(p,c))return;let old=c.equip[p.slot];if(old!==undefined)s.inventory.push({id:s.partNext++,kind:old});c.equip[p.slot]=item.kind;s.inventory.splice(i,1);s.money-=5000;msg='Установлено: '+p.name})}function removePart(slot){action(()=>{let c=car(),k=c.equip[slot];if(k===undefined)return;s.inventory.push({id:s.partNext++,kind:k});delete c.equip[slot];msg='Деталь возвращена на склад'})}let opening=false;function animateCase(type){if(opening||!s.keys)return;opening=true;openCase(type);save();let reward=msg;let overlay=document.createElement('div');overlay.className='caseOverlay';overlay.innerHTML='<div class="casePanel"><small>AUTO EMPIRE / CASE</small><div class="crate">◆</div><h2>Открытие кейса</h2><div class="roll">◆ ◆ ◆ ◆ ◆</div><button>Пропустить</button></div>';document.body.append(overlay);let timer;function finish(){if(!opening)return;clearTimeout(timer);opening=false;overlay.remove();msg=reward;render()}overlay.querySelector('button').onclick=finish;timer=setTimeout(finish,matchMedia('(prefers-reduced-motion: reduce)').matches?50:1800)}let busy=false,run=null;const ratios=[3.64,1.95,1.36,.94,.78];function shiftRace(){if(!run||run.gear>=5||run.shift>0)return;run.gear++;run.shift=.25}function runRace(){if(busy)return;busy=true;const c=car(),m=model(),power=hp();run={gear:1,v:0,x:0,t:0,rpm:900,shift:0,gas:false};const r=run;const el=id=>document.getElementById(id);el('startRace').disabled=true;el('gas').disabled=false;el('shift').disabled=false;const gas=el('gas');gas.onpointerdown=e=>{gas.setPointerCapture(e.pointerId);r.gas=true};gas.onpointerup=gas.onpointercancel=gas.onlostpointercapture=()=>r.gas=false;gas.onkeydown=e=>{if(e.key===' '||e.key==='Enter')r.gas=true};gas.onkeyup=()=>r.gas=false;gas.onblur=()=>r.gas=false;let last=performance.now();function frame(now){if(tab!==5||!el('speed')||!el('startRace').disabled){busy=false;run=null;return}let dt=Math.min(.05,(now-last)/1000);last=now;r.t+=dt;r.shift=Math.max(0,r.shift-dt);let ratio=ratios[r.gear-1]*3.7;r.rpm=Math.max(r.gas?1800:900,r.v/.29*ratio*60/(2*Math.PI));let torque=power*735.5/(5500*2*Math.PI/60)*Math.max(.35,1-Math.abs(r.rpm-4300)/6500);let force=r.gas&&r.shift===0&&r.rpm<6800?Math.min(m.mass*9.81*.55,torque*ratio*.86/.29):0;let acc=(force- .014*m.mass*9.81-.39*r.v*r.v)/m.mass;r.v=Math.max(0,r.v+acc*dt);r.x+=r.v*dt;el('speed').textContent=Math.round(r.v*3.6)+' км/ч';el('gear').textContent=r.gear;el('clock').textContent=r.t.toFixed(2);el('rpm').textContent=Math.round(r.rpm);el('tach').value=r.rpm;el('player').style.left=(Math.min(1,r.x/402)*65)+'%';el('rival').style.left=(Math.min(1,Math.pow(r.t/18.5,1.5))*65)+'%';el('raceout').textContent=Math.min(402,Math.floor(r.x))+' / 402 м · '+(r.rpm>5900?'Переключай!':'');if(r.x>=402||r.t>=60){busy=false;run=null;action(()=>{let win=r.x>=402&&r.t<18.5;if(win){s.wins++;s.money+=3500;s.keys++}else if(r.x>=402)s.money+=500;msg=(win?'Победа! +3 500 ₽ и ключ':r.x>=402?'Финиш! +500 ₽':'Время вышло')+' · '+r.t.toFixed(2)+' с'});return}requestAnimationFrame(frame)}requestAnimationFrame(frame)}render();</script></html>
